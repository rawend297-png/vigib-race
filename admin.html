<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel Admin · AEVORA Race</title>
<link rel="icon" type="image/png" href="favicon-aevora.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --base:#100d0a; --deep:#0b0907; --card:#221d17; --card2:#2e271d; --line:#584832;
  --gold:#e2ba70; --hi:#ffecc4; --lo:#966c30; --ivory:#faf3e4; --muted:#b0a696; --ink:#1c160e;
  --sage:#9cc79a; --rose:#e58a7a; --sky:#8fb8d8;
  --display:'Cinzel', Georgia, serif; --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--base);color:var(--ivory);font-family:var(--sans);font-size:14px;
  background-image:radial-gradient(circle at 12% 8%, rgba(226,186,112,.10) 0%, transparent 38%),radial-gradient(circle at 88% 92%, rgba(150,108,48,.12) 0%, transparent 42%);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.panel{background:linear-gradient(180deg,rgba(46,39,29,.82),rgba(34,29,23,.86));border:1px solid rgba(226,186,112,.18);border-radius:16px}
.gold-text{background:linear-gradient(180deg,#ffecc4 0%,#e2ba70 55%,#966c30 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cinzel{font-family:var(--display)}
.muted{color:var(--muted)} .gold{color:var(--gold)} .sage{color:var(--sage)} .rose{color:var(--rose)}
.ico{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font-family:var(--sans);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid rgba(226,186,112,.3);background:rgba(11,9,7,.6);color:var(--ivory);cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--hi)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#ffecc4 0%,#e2ba70 100%);color:var(--ink);border-color:transparent}
.btn.gold:hover{filter:brightness(1.05);color:var(--ink)}
.btn.danger{border-color:rgba(229,138,122,.45);color:var(--rose)}
.btn.danger:hover{background:rgba(229,138,122,.12);color:#ffb3a6}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ivory)}
input.in,select.in{width:100%;padding:10px 12px;border-radius:9px;border:1px solid rgba(88,72,50,.9);background:rgba(11,9,7,.75);color:var(--ivory);outline:none}
input.in:focus,select.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,186,112,.15)}
input.cell{width:100%;padding:6px 8px;border-radius:6px;border:1px solid rgba(88,72,50,.7);background:rgba(11,9,7,.6);color:var(--ivory);outline:none;font-size:13px}
input.cell:focus{border-color:var(--gold)}
input.cell.n{max-width:90px}
label.lb{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

/* login */
.login{max-width:400px;margin:8vh auto 0;padding:30px 28px;display:flex;flex-direction:column;gap:16px;text-align:center}
.login img{width:84px;height:84px;margin:0 auto;filter:drop-shadow(0 0 18px rgba(226,186,112,.35))}
.login h1{margin:0;font-family:var(--display);font-size:26px;letter-spacing:.06em}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.msg{padding:10px 12px;border-radius:9px;font-size:13px}
.msg.err{background:rgba(229,138,122,.1);border:1px solid rgba(229,138,122,.35);color:var(--rose)}
.msg.ok{background:rgba(156,199,154,.1);border:1px solid rgba(156,199,154,.35);color:var(--sage)}
.msg.warn{background:rgba(226,186,112,.08);border:1px solid rgba(226,186,112,.35);color:var(--hi)}

/* header */
header.panel{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:48px;height:48px}
.brand h1{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.06em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:10px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.role.super{background:linear-gradient(180deg,#ffecc4,#e2ba70);color:var(--ink)}
.role.admin{background:rgba(143,184,216,.15);color:var(--sky);border:1px solid rgba(143,184,216,.35)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:rgba(11,9,7,.7);padding:6px;border-radius:12px;border:1px solid rgba(88,72,50,.7);width:fit-content}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer}
.tab:hover{color:var(--ivory);background:rgba(46,39,29,.7)}
.tab.active{background:linear-gradient(180deg,#ffecc4 0%,#e2ba70 100%);color:var(--ink)}
.main{padding:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{margin:0;font-family:var(--display);font-size:20px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:rgba(11,9,7,.6);border:1px solid rgba(88,72,50,.7)}
.seg button{padding:6px 14px;border-radius:7px;border:0;background:none;color:var(--muted);font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:12px;cursor:pointer}
.seg button.active{background:linear-gradient(180deg,#ffecc4,#e2ba70);color:var(--ink)}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:12px;background:rgba(11,9,7,.45);border:1px solid rgba(88,72,50,.6);flex-wrap:wrap}
.item.deleted{opacity:.55;border-style:dashed}
.item .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .s{font-size:12px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.tag.ed{background:rgba(143,184,216,.15);color:var(--sky)}
.tag.del{background:rgba(229,138,122,.15);color:var(--rose)}
.tag.warn{background:rgba(226,186,112,.18);color:var(--gold)}
.warnbox{margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(226,186,112,.45);background:rgba(226,186,112,.08);font-size:12.5px;line-height:1.5}
.warnbox b{color:var(--gold)}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid rgba(88,72,50,.7);font-weight:700}
td{padding:9px 10px;border-bottom:1px solid rgba(88,72,50,.35);vertical-align:middle}
tr.deleted td{opacity:.5}
.tw{overflow-x:auto;border-radius:12px;border:1px solid rgba(88,72,50,.6);background:rgba(11,9,7,.35)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,4,3,.75);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{width:100%;max-width:880px;padding:22px;display:flex;flex-direction:column;gap:16px}
.modal.sm{max-width:420px}
.modal h3{margin:0;font-family:var(--display);font-size:19px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:4px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;top:18px;right:18px;z-index:60;padding:12px 16px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:360px}
.log td{font-size:12.5px}
.add-row{margin-top:6px;align-self:flex-start}
input.cell.dt{min-width:190px}

@media (max-width:900px){
  .wrap{padding:18px 14px}
  .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}.wrap{padding:12px 10px;gap:14px}.main{padding:14px}
  header.panel{flex-direction:column;align-items:stretch;padding:14px}
  .brand h1{font-size:19px}.brand img{width:40px;height:40px}
  .who{justify-content:space-between}
  .who .btn{flex:1;justify-content:center}
  .bar{flex-direction:column;align-items:stretch}
  .bar>div,.bar>.btn{width:100%}
  .bar .seg{width:100%;justify-content:space-between}.bar .seg button{flex:1}
  .item{flex-direction:column;align-items:stretch}
  .item .acts .btn{flex:1;justify-content:center}
  .modal{padding:16px}
  .modal .tw table{min-width:540px}
  .modal .tw table input.cell{min-width:70px}
  .modal-bg{padding:2vh 8px}
  .foot .btn{flex:1;justify-content:center}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{padding:10px 12px;border-bottom:1px solid rgba(88,72,50,.5)}
  table.stack td{border:0;padding:5px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  table.stack td::before{content:attr(data-l);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
  table.stack td:not([data-l])::before{content:none}
  table.stack td>*:not(:first-child){max-width:65%}
  table.stack input.cell.n{max-width:none}
  table.stack .acts{width:100%}table.stack .acts .btn{flex:1;justify-content:center}
  .toast{left:10px;right:10px;max-width:none}
}
</style>

<script>
(() => {

  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',

const ico = (n) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ""}</svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const S = { user: null, tab: "sesi", mode: "liga", raw: null, ov: null, accounts: null, log: null, busy: false, loginErr: null, setup: null };

async function api(path, body, method) {
  const opt = { method: method || (body ? "POST" : "GET"), credentials: "same-origin", headers: {} };
  if (body) { opt.headers["content-type"] = "application/json"; opt.headers["x-vigib"] = "1"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && path !== "/api/login" && path !== "/api/password") { S.user = null; render(); }
  if (r.status === 403 && /Kode akses/i.test(j.error || "")) { location.reload(); throw new Error(j.error); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function toast(msg, kind = "ok") {
  const el = $("#toast");
  el.innerHTML = `<div class="toast panel msg ${kind}">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.innerHTML = ""; }, 3800);
}
async function run(fn, okMsg) {
  if (S.busy) return;
  S.busy = true;
  try { await fn(); if (okMsg) toast(okMsg, "ok"); }
  catch (e) { toast(e.message || String(e), "err"); }
  finally { S.busy = false; }
}

const XLSX = (() => {
  const enc = new TextEncoder();
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const body = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1);
      if (ri === 0) return `<c r="${ref}" t="inlineStr" s="1"><is><t>${x(v)}</t></is></c>`;
      if (v === null || v === undefined || v === "") return "";
      if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      if (v instanceof Date) return `<c r="${ref}" s="2"><v>${(v.getTime() - v.getTimezoneOffset() * 60000) / 86400000 + 25569}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join("")}</row>`).join("");
    const colXml = cols.length ? `<cols>${cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.w || 14}" customWidth="1"/>`).join("")}</cols>` : "";
    const last = colName(Math.max(cols.length, 1) - 1) + Math.max(rows.length, 1);
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${colXml}<sheetData>${body}</sheetData>${rows.length > 1 ? `<autoFilter ref="A1:${last}"/>` : ""}</worksheet>`;
  }
  function zip(files) {
    const parts = [], central = []; let off = 0;
    const u16 = (n) => [n & 255, (n >>> 8) & 255], u32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

      { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: "xl/workbook.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${named.map((s, i) => `<sheet name="${x(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>` },
      { name: "xl/_rels/workbook.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${named.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${named.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: "xl/styles.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd mmm yyyy hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF1C160E"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE2BA70"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...named.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
    ];
    return zip(files);
  }
  function download(filename, sheets) {
    const blob = build(sheets);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

})();

// (2026-11-05) Excel = tampilan website. opt = { mode, view: "standings" | "history", rows }:
//   hanya tabel yang sedang dibuka yang diambil (mode + tab). rows = baris tabel Klasemen persis seperti
//   di layar (sudah tersaring pencarian & terurut). Tanpa opt -> semua mode, kedua tab. Untuk setiap mode:
//   "Klasemen <MODE>" -> tabel tab Klasemen (kolom & urutan peringkat sama, urutan default)
//   "Riwayat <MODE>"  -> kartu tab Riwayat Sesi (badge #N, judul sesi, tanggal, jumlah peserta/juara,
//                        tim, lalu juara per baris), urutan terbaru dulu seperti di website
function vigibSheets(data, opt = {}) {
  const MODES_X = [["liga", "LIGA"], ["normal", "NORMAL"], ["team", "TEAM"]];
  const toDate = (t) => { const n = Number(t); return n > 0 ? new Date(n < 1e11 ? n * 1000 : n) : ""; };
  const badgeOf = (s) => s.badge || s.sessionNumber;
  const titleOf = (s) => s.name || s.title || `Sesi ${s.bookNumber || s.sessionNumber}`;
  const sessionsOf = (md) => [...((md && md.sessions) || [])].sort((a, b) => badgeOf(b) - badgeOf(a));

  // sama dengan playerStandings() / teamStandings() / computeRows() di index.html
  const players = (mode, md) => {
    const map = new Map();
    const get = (uid, name) => {
      const k = String(uid);
      if (!map.has(k)) map.set(k, { userId: k, username: name || "Player_" + k, points: 0, wins: 0, podiums: 0, finishes: 0, sessions: 0 });
      const e = map.get(k);
      if (name) e.username = name;
      return e;
    };
    sessionsOf(md).reverse().forEach((s) => {
      (s.participants || []).forEach((p) => { get(p.userId, p.displayName).sessions += 1; });
      (s.champions || []).forEach((c) => {
        const e = get(c.userId, c.displayName);
        e.finishes += 1;
        if (c.rank === 1) e.wins += 1;
        if (c.rank >= 1 && c.rank <= 3) e.podiums += 1;
      });
      if (mode === "liga") (s.ligaPoints || []).forEach((l) => { get(l.userId, l.displayName).points += Number(l.points) || 0; });
    });
    if (mode === "liga" && md && Array.isArray(md.ligaLeaderboard) && md.ligaLeaderboard.length) {
      map.forEach((e) => { e.points = 0; });
      md.ligaLeaderboard.forEach((l) => { get(l.userId, l.displayName).points = Number(l.totalPoints) || 0; });
    }
    return [...map.values()].sort((a, b) => mode === "normal"
      ? (b.wins - a.wins) || (b.podiums - a.podiums) || (b.finishes - a.finishes)
      : (b.points - a.points) || (b.wins - a.wins));
  };
  const teams = (md) => {
    const map = new Map();
    sessionsOf(md).reverse().forEach((s) => {
      [...(s.teamData || [])].sort((a, b) => (b.points || 0) - (a.points || 0)).forEach((t, i) => {
        const k = (t.name || "TIM").toUpperCase();
        if (!map.has(k)) map.set(k, { name: t.name || "TIM", points: 0, wins: 0, sessions: 0, members: 0 });
        const e = map.get(k);
        e.points += Number(t.points) || 0;
        e.sessions += 1;
        if (i === 0 && (t.points || 0) > 0) e.wins += 1;
        e.members = Math.max(e.members, t.memberCount || 0);
      });
    });
    return [...map.values()].sort((a, b) => (b.points - a.points) || (b.wins - a.wins));
  };

  const klasemen = [], riwayat = [];
  for (const [m, label] of MODES_X) {
    if (opt.mode && m !== opt.mode) continue;
    const md = (data.modes && data.modes[m]) || { sessions: [] };
    const ss = sessionsOf(md);
    const shown = (list) => (Array.isArray(opt.rows) && opt.mode === m ? opt.rows : list);

    // ---- tab Klasemen ----
    if (opt.view === "history") {
      // tab Klasemen tidak sedang dibuka
    } else if (m === "team") {
      const list = shown(teams(md));
      if (list.length) klasemen.push({ name: `Klasemen ${label}`,
        cols: [{ h: "Rank", w: 7 }, { h: "Tim", w: 24 }, { h: "Sesi", w: 8 }, { h: "Menang 🏆", w: 11 }, { h: "Anggota", w: 10 }, { h: "Total Poin", w: 12 }],
        rows: list.map((r, i) => [r.rank || i + 1, r.name, r.sessions, r.wins, r.members, r.points]) });
    } else {
      const list = shown(players(m, md));
      if (list.length) klasemen.push({ name: `Klasemen ${label}`,
        cols: [{ h: "Rank", w: 7 }, { h: "Pembalap", w: 26 }, { h: "UserId", w: 14 }, { h: "Sesi Diikuti", w: 12 }, { h: "Juara 1 🏆", w: 11 }, { h: "Podium 🥇🥈🥉", w: 14 }, { h: m === "liga" ? "Poin Liga" : "Total Finish", w: 12 }],
        rows: list.map((r, i) => [r.rank || i + 1, r.username, Number(r.userId) || r.userId, r.sessions, r.wins, r.podiums, m === "liga" ? r.points : r.finishes]) });
    }

    // ---- tab Riwayat Sesi ----
    if (opt.view === "standings" || !ss.length) continue;
    const cols = [{ h: "Sesi", w: 7 }, { h: "Nama Sesi", w: 18 }, { h: "Tanggal", w: 19 }, { h: "Peserta", w: 9 }, { h: "Juara", w: 8 }];
    if (m === "team") cols.push({ h: "Tim", w: 40 });
    cols.push({ h: "Posisi", w: 8 }, { h: "Pembalap", w: 26 }, { h: "UserId", w: 14 });
    if (m === "liga") cols.push({ h: "Poin", w: 8 });
    const rows = [];
    for (const s of ss) {
      const champs = [...(s.champions || [])].sort((a, b) => a.rank - b.rank);
      const head = [badgeOf(s), titleOf(s), toDate(s.timestamp), (s.participants || []).length, champs.length];
      if (m === "team") head.push([...(s.teamData || [])].sort((a, b) => (b.points || 0) - (a.points || 0)).map((t, i) => `#${i + 1} ${t.name || "TIM"} (${Number(t.points) || 0} PTS)`).join(" · "));
      if (!champs.length) { rows.push([...head, "", "Tidak ada yang finish.", ""]); continue; }
      const pts = {}; (s.ligaPoints || []).forEach((l) => { pts[l.userId] = l.points; });
      for (const c of champs) {
        const row = [...head, Number(c.rank) || "", c.displayName || "", Number(c.userId) || ""];
        if (m === "liga") { const p = pts[c.userId] ?? c.points; row.push(p != null && p !== "" ? Number(p) : ""); }
        rows.push(row);
      }
    }
    riwayat.push({ name: `Riwayat ${label}`, cols, rows });
  }
  const sheets = [...klasemen, ...riwayat];
  if (!sheets.length) sheets.push({ name: "AEVORA Race", cols: [{ h: "Info", w: 40 }], rows: [["Belum ada data untuk tabel ini"]] });
  return sheets;
}
function vigibExcelName(part) {
  const t = new Date(), p = (n) => String(n).padStart(2, "0");
  return `AEVORA_Race_${part ? part + "_" : ""}${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}.xlsx`;
}

  S.raw = j.raw; S.ov = j.overlay; S.conflicts = Array.isArray(j.conflicts) ? j.conflicts : []; S.githubSync = !!j.githubSync;
}
async function loadAccounts() {
  S.accounts = (await api("/api/super/accounts")).accounts;
  try { S.gate = await api("/api/super/gate"); } catch { S.gate = null; }
}
async function loadLog() { S.log = (await api("/api/admin/log")).log; }
async function refreshTab() {
  if (S.tab === "sesi" || S.tab === "klasemen") await loadState();
  if (S.tab === "akun") await loadAccounts();
  if (S.tab === "log") await loadLog();
}

function sessionsView(mode) {
  const raw = (S.raw && S.raw.modes[mode] && S.raw.modes[mode].sessions) || [];
  const del = new Set((S.ov.deleted[mode] || []).map(Number));
  const ed = S.ov.edits[mode] || {};
  const ada = new Set(raw.map((s) => Number(s.sessionNumber)));
  const tambahan = Object.keys(ed).map(Number).filter((n) => !ada.has(n)).map((n) => ({ raw: null, cur: ed[n], edited: false, added: true, deleted: del.has(n) }));
  const list = [...raw].map((s) => ({
    raw: s, cur: ed[s.sessionNumber] || s, edited: !!ed[s.sessionNumber], deleted: del.has(Number(s.sessionNumber)),
  })).concat(tambahan);
  // badge #N = urutan sesi yang tampil (1 = paling lama), sama seperti di website
  const key = (x) => { const t = Math.floor(Number(x.cur.timestamp)) || 0; return t > 0 && t < 1e11 ? t * 1000 : t; };
  const asc = list.slice().sort((a, b) => (key(a) - key(b)) || (a.cur.sessionNumber - b.cur.sessionNumber));
  let i = 0;
  for (const x of asc) x.badge = x.deleted ? null : ++i;
  return asc.reverse();
}
function leaderboardView() {
  const lb = (S.raw && S.raw.modes.liga && S.raw.modes.liga.ligaLeaderboard) || [];
  const del = new Set((S.ov.lbDeleted.liga || []).map(String));
  const ed = S.ov.lbEdits.liga || {};
  const ada = new Set(lb.map((e) => String(e.userId)));
  const tambahan = Object.keys(ed).filter((u) => !ada.has(u)).map((u) => ({ raw: null, cur: { userId: Number(u), displayName: "", totalPoints: 0, ...ed[u] }, edited: false, added: true, deleted: del.has(u) }));
  return lb.map((e) => ({ raw: e, cur: ed[e.userId] ? { ...e, ...ed[e.userId] } : e, edited: !!ed[e.userId], deleted: del.has(String(e.userId)) }))
    .concat(tambahan).sort((a, b) => (Number(b.cur.totalPoints) || 0) - (Number(a.cur.totalPoints) || 0));
}

  const tabs = [["sesi", "Data Sesi", "book"], ["klasemen", "Klasemen Liga", "trophy"]]
    .concat(isSuper ? [["akun", "Akun Admin", "users"]] : []).concat([["log", "Log", "list"]]);
  app.innerHTML = `
  <header class="panel">
    <div class="brand"><img src="logo-aevora.png" alt="AEVORA"><div><h1 class="gold-text">PANEL ADMIN</h1><p>AEVORA Race</p></div></div>

      <span class="role ${S.user.role}">${S.user.role === "super" ? "Super Admin" : "Admin"}</span>
      <b>${esc(S.user.username)}</b>
      <button class="btn sm" data-act="pw">${ico("key")} Ganti Password</button>

function setupView() {

    <img src="logo-aevora.png" alt="AEVORA">
    <div><h1 class="gold-text">SETUP AWAL</h1><div class="muted" style="margin-top:4px">Buat akun Super Admin (hanya sekali)</div></div>

function bindSetup() {
  $("#setupForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if ($("#sp").value !== $("#sp2").value) { S.loginErr = "Password tidak sama"; render(); return; }
    run(async () => {
      try {
        const j = await api("/api/setup", { username: S.setup.username, password: $("#sp").value });
        S.user = j.user; S.setup = { needed: false }; S.loginErr = null;
        await refreshTab();
      } catch (er) { S.loginErr = er.message; }
      render();
    }, null);
  });
}
function bindLogin() {
  $("#loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    run(async () => {
      try {
        const j = await api("/api/login", { username: fd.get("username"), password: fd.get("password") });
        S.user = j.user; S.loginErr = null;
        await refreshTab();
      } catch (er) { S.loginErr = er.message; }
      render();
    });
  });
}

function sesiBody() {

    ? `<div class="warnbox"><b>Bentrok nomor sesi (${konflik.length})</b><br>Sesi buatan admin di bawah memakai nomor yang kini juga dipakai sesi asli dari game. Website menampilkan sesi dari game, bukan versi admin. Salin data yang masih dibutuhkan lewat <b>Tambah Sesi</b>, lalu klik <b>Batalkan Edit</b> pada sesi bentrok.<ul>${konflik.map((c) => `<li>${esc(MODES[c.mode] || c.mode)} · Sesi #${Number(c.sessionNumber)}</li>`).join("")}</ul></div>`

function klasemenBody() {

// ---------- modal ----------
function openModal(html, onBind, size = "") {
  $("#modal").innerHTML = `<div class="modal-bg"><div class="panel modal ${size}">${html}</div></div>`;
  const bg = $("#modal .modal-bg");
  bg.addEventListener("mousedown", (e) => { if (e.target === bg) closeModal(); });
  $("#modal [data-close]") && $("#modal").querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  onBind && onBind($("#modal .modal"));
}
function closeModal() { $("#modal").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    openModal(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p>
      <div class="foot"><button class="btn" data-close>Batal</button><button class="btn ${danger ? "danger" : "gold"}" id="okb">${esc(okLabel)}</button></div>`,
      (m) => { $("#okb", m).addEventListener("click", () => { closeModal(); resolve(true); }); }, "sm");
    $("#modal").querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => resolve(false)));
  });
}

function rowsEditor(key, title, rows, cols) {
  ROW_TPL[key] = cols;
  const tr = (r) => `<tr>${cols.map((c) => `<td><input class="cell ${c.num ? "n" : ""}" data-f="${c.f}" ${c.num ? 'type="number" step="any"' : ""} value="${esc(r[c.f] ?? "")}" ${c.ro ? "readonly" : ""}></td>`).join("")}
    <td><button class="btn sm ghost" data-rm title="Hapus baris">${ico("x")}</button></td></tr>`;
  return `<div class="sec" data-sec="${key}"><h4>${title}</h4>
    <div class="tw"><table><thead><tr>${cols.map((c) => `<th>${c.l}</th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map(tr).join("") || `<tr class="none"><td colspan="${cols.length + 1}" class="muted">Kosong</td></tr>`}</tbody></table></div>
    <button type="button" class="btn sm add-row" data-add="${key}">${ico("plus")} Tambah baris</button></div>`;
}
const ROW_TPL = {};
function rowHtml(key) {
  const cols = ROW_TPL[key] || [];
  return `<tr data-new="1">${cols.map((c) => `<td><input class="cell ${c.num ? "n" : ""}" data-f="${c.f}" ${c.num ? 'type="number" step="any"' : ""} value=""></td>`).join("")}
    <td><button class="btn sm ghost" data-rm title="Hapus baris">${ico("x")}</button></td></tr>`;
}
const toLocalInput = (unix) => { if (!unix) return ""; const d = new Date(unix * 1000); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const COLS = {
  champions: [{ f: "rank", l: "Posisi", num: 1 }, { f: "displayName", l: "Nama" }, { f: "points", l: "Poin", num: 1 }, { f: "userId", l: "UserId", num: 1 }],
  ligaPoints: [{ f: "displayName", l: "Nama" }, { f: "points", l: "Poin Liga", num: 1 }, { f: "userId", l: "UserId", num: 1 }],
  participants: [{ f: "displayName", l: "Nama" }, { f: "userId", l: "UserId", num: 1 }],

};

function editSession(n, baru) {
  let v = sessionsView(S.mode).find((x) => Number(x.cur.sessionNumber) === Number(n));
  if (!v && baru) v = { cur: { sessionNumber: Number(n), timestamp: Math.floor(Date.now() / 1000), mode: S.mode, champions: [], participants: [], ...(S.mode === "liga" ? { ligaPoints: [] } : {}), ...(S.mode === "team" ? { teamData: [] } : {}) }, edited: false };
  if (!v) return;
  const s = JSON.parse(JSON.stringify(v.cur));
  const secs = [rowsEditor("champions", "Juara / Finish", s.champions || [], COLS.champions)];
  if (S.mode === "liga" || s.ligaPoints) secs.push(rowsEditor("ligaPoints", "Poin Liga Sesi Ini", s.ligaPoints || [], COLS.ligaPoints));
  if (S.mode === "team" || s.teamData) secs.push(rowsEditor("teamData", "Tim", s.teamData || [], COLS.teamData));
  secs.push(rowsEditor("participants", "Peserta", s.participants || [], COLS.participants));

  openModal(`<h3>${baru ? "Tambah" : "Edit"} Sesi ${MODES[S.mode]}</h3>
    <div class="muted" style="font-size:12.5px;margin-top:-8px">${baru ? "Sesi baru dibuat dari panel admin" : fmtDate(s.timestamp)}${v.edited ? " · sudah pernah diedit" : ""}</div>
    <div class="grid2">
      <div><label class="lb" for="sessNum">Nomor Sesi (Book)</label><input class="cell n" id="sessNum" type="number" min="1" value="${s.sessionNumber || ""}"></div>
      <div><label class="lb" for="sessName">Nama Sesi (Opsional)</label><input class="cell" id="sessName" value="${esc(s.name || s.title || "")}" placeholder="Contoh: Sesi 5"></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div><label class="lb" for="sessDate">Tanggal & jam</label><input class="cell dt" id="sessDate" type="datetime-local" value="${toLocalInput(s.timestamp)}"></div>
    </div>
    ${secs.join("")}
    <div class="foot"><button class="btn" data-close>Batal</button><button class="btn gold" id="saveSess">Simpan Perubahan</button></div>`, (m) => {
    m.addEventListener("click", (e) => {
      const rm = e.target.closest("[data-rm]");
      if (rm) { rm.closest("tr").remove(); return; }
      const add = e.target.closest("[data-add]");
      if (add) {
        const tb = m.querySelector(`[data-sec="${add.dataset.add}"] tbody`);
        const none = tb.querySelector("tr.none"); if (none) none.remove();
        tb.insertAdjacentHTML("beforeend", rowHtml(add.dataset.add));
        const inp = tb.lastElementChild.querySelector("input"); if (inp) inp.focus();
      }
    });
    $("#saveSess", m).addEventListener("click", () => {
      const read = (key) => {
        const sec = m.querySelector(`[data-sec="${key}"]`);
        if (!sec) return undefined;
        return [...sec.querySelectorAll("tbody tr:not(.none)")].map((tr) => {
          const orig = tr.dataset.new ? {} : (((s[key] || [])[Number(tr.dataset.i)]) || {});
          const o = { ...orig };
          tr.querySelectorAll("[data-f]").forEach((inp) => {
            const f = inp.dataset.f;
            o[f] = inp.type === "number" ? (inp.value === "" ? undefined : Number(inp.value)) : inp.value;
          });
          return o;
        });
      };
      const out = { ...s };
      const numInput = Number($("#sessNum", m).value);
      if (numInput > 0) out.sessionNumber = numInput;
      const nameInput = $("#sessName", m).value.trim();
      if (nameInput) out.name = nameInput; else delete out.name;

      const dv = $("#sessDate", m).value;
      if (dv) { const t = new Date(dv).getTime(); if (!isNaN(t)) out.timestamp = Math.floor(t / 1000); }
      ["champions", "ligaPoints", "teamData", "participants"].forEach((k) => { const r = read(k); if (r !== undefined) out[k] = r; });
      run(async () => {
        const j = await api("/api/admin/session/save", { mode: S.mode, session: out, isNew: !!baru });
        S.ov = j.overlay; closeModal(); render();
      }, `Sesi #${out.sessionNumber} ${baru ? "ditambahkan" : "disimpan"}`);
    });
  });
  $("#modal").querySelectorAll("[data-sec]").forEach((sec) => sec.querySelectorAll("tbody tr:not(.none)").forEach((tr, i) => { tr.dataset.i = i; }));
}

}

async function onAct(b) {
  const a = b.dataset.act, n = b.dataset.n, u = b.dataset.u;
  const tr = b.closest("tr");
  const uid = tr && tr.dataset.uid;
  const post = (path, body, msg) => run(async () => { const j = await api(path, body); if (j.overlay) S.ov = j.overlay; render(); }, msg);
  switch (a) {
    case "logout": await run(async () => { await api("/api/logout", {}); }); S.user = null; S.raw = S.ov = S.accounts = S.log = null; render(); break;
    case "pw": passwordForm(); break;
    case "reload": run(async () => { await refreshTab(); render(); }, "Data dimuat ulang"); break;
    case "edit": editSession(n); break;
    case "newsess": {
      const all = sessionsView(S.mode).map((x) => Number(x.cur.sessionNumber));
      const deletedNums = (S.ov.deleted[S.mode] || []).map(Number);
      const maxPernah = Number(((S.ov.maxNum || {})[S.mode]) || 0);
      editSession(Math.max(0, ...all, ...deletedNums, maxPernah) + 1, true);
      break;
    }
    case "deladded":
      if (await confirmBox(`Hapus sesi #${n}?`, "Sesi ini ditambahkan dari panel admin dan akan dihapus permanen.", "Hapus", true))
        post("/api/admin/session/revert", { mode: S.mode, sessionNumber: Number(n) }, `Sesi #${n} dihapus`);
      break;
    case "newlb": lbAddForm(); break;
    case "excel": run(downloadExcel, "File Excel diunduh"); break;
    case "del":
      if (await confirmBox(`Hapus sesi #${n}?`, "Sesi ini dihapus dari website dan data. Sesi akan muncul lagi kalau Book dikirim ulang dari game.", "Hapus", true))
        purgePost("/api/admin/session/delete", { mode: S.mode, sessionNumber: Number(n) }, `Sesi #${n} dihapus`);
      break;
    case "delall": deleteAllForm(); break;
    case "restore": post("/api/admin/session/restore", { mode: S.mode, sessionNumber: Number(n) }, `Sesi #${n} dipulihkan`); break;
    case "revert":
      if (await confirmBox(`Batalkan edit sesi #${n}?`, "Sesi kembali ke data asli dari game.", "Batalkan Edit"))
        post("/api/admin/session/revert", { mode: S.mode, sessionNumber: Number(n) }, `Edit sesi #${n} dibatalkan`);
      break;
    case "lbsave": {
      const v = (f) => tr.querySelector(`[data-f="${f}"]`).value;
      const body = { userId: Number(uid), displayName: v("displayName"), totalPoints: Number(v("totalPoints")) };
      if (v("sessionCount") !== "") body.sessionCount = Number(v("sessionCount"));
      post("/api/admin/leaderboard/save", body, "Klasemen disimpan");
      break;
    }
    case "lbrevert": post("/api/admin/leaderboard/revert", { userId: Number(uid) }, "Edit dibatalkan"); break;
    case "lbdel":
      if (tr && tr.dataset.added) {
        if (await confirmBox("Hapus pembalap ini?", "Pembalap ini ditambahkan dari panel admin dan akan dihapus permanen.", "Hapus", true))
          post("/api/admin/leaderboard/revert", { userId: Number(uid) }, "Dihapus dari klasemen");
        break;
      }
      if (await confirmBox("Hapus dari klasemen?", "Pembalap ini disembunyikan dari klasemen liga. Bisa dipulihkan.", "Hapus", true))
        post("/api/admin/leaderboard/delete", { userId: Number(uid) }, "Dihapus dari klasemen");
      break;
    case "lbrestore": post("/api/admin/leaderboard/restore", { userId: Number(uid) }, "Dipulihkan"); break;
    case "newacct": accountForm("new"); break;
    case "gate": gateForm(); break;
    case "reset": accountForm("reset", u); break;
    case "delacct":
      if (await confirmBox(`Hapus akun ${u}?`, "Akun admin ini tidak bisa login lagi.", "Hapus Akun", true))
        run(async () => { await api("/api/super/accounts/delete", { username: u }); await loadAccounts(); render(); }, `Akun ${u} dihapus`);
      break;
  }
}

(async () => {
  render();
  try {
    const j = await api("/api/me");
    S.user = j.user;
    await refreshTab();
  } catch {
    S.user = null;
    try { S.setup = await (await fetch("/api/setup")).json(); } catch {}
  }
  render();
})();
})();
</script>
</body>
</html>
